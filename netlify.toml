# Netlify configuration for the whole repository.
#
# It lives at the root rather than beside the app because `base` has to be
# resolved before anything else. With the file inside apps/web, Netlify found
# it but still resolved `publish` and the build command against the repository
# root: it built the monorepo with turbo, which tried to compile the contracts
# with Foundry, which does not exist on a Netlify builder and does not need to.
#
# With `base` set here, Netlify changes into apps/web first and every other
# path below is relative to it.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Domain
# ---------------------------------------------------------------------------
# punsfun.app is canonical. Set it as the primary domain in the Netlify UI as
# well; these rules make every other address agree with it, so search engines,
# wallet origin checks and the Reown allow-list all see the same name.

[[redirects]]
  from = "https://www.punsfun.app/*"
  to = "https://punsfun.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://puns.netlify.app/*"
  to = "https://punsfun.app/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
# Functions are routed by Netlify itself and a rule for them is rejected, so
# there is none here. Everything else is a single-page app: any path the
# filesystem does not answer belongs to the router.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A wallet app has no business inside someone else's frame.
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Hashed assets never change under the same name, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must not be, or a deploy takes a day to reach anyone.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
