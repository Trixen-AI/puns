[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Domain
# ---------------------------------------------------------------------------
# punsfun.app is the canonical address. Set it as the primary domain in the
# Netlify UI as well; these rules make every other address agree with it.
#
# Without them the same site answers on three names, and search engines, wallet
# origin checks and the Reown allow-list each see a different one.

# www to the apex, permanently.
[[redirects]]
  from = "https://www.punsfun.app/*"
  to = "https://punsfun.app/:splat"
  status = 301
  force = true

# Netlify's own subdomain should not serve the site as if it were the product.
[[redirects]]
  from = "https://puns.netlify.app/*"
  to = "https://punsfun.app/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
# Functions first: the single-page rewrite below would otherwise swallow them.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Every other route is handled by the app, not the filesystem.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A wallet app has no business inside someone else's frame.
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Hashed assets never change under the same name, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must not be, or a deploy takes a day to reach anyone.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The indexer's schedule is declared in the function itself, beside the code it
# governs, so the two cannot drift apart.
