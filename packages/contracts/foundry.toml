[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "cancun"
bytecode_hash = "none"
gas_reports = ["PunsPass"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
local = "http://127.0.0.1:8545"

